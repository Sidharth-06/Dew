name: dew
description: Music Streaming app made in Flutter!


publish_to: 'none'
version: '9.0.1' # run update.sh after changing the version

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ^3.27.0

dependencies:
  
  animated_bottom_navigation_bar: ^1.3.3
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.5.1
  dart_des: ^1.0.2
  flutter_widget_from_html: ^0.15.3
  device_info_plus: ^11.2.0
  dynamic_color: ^1.6.8
  encrypt: ^5.0.3
  file_picker: 8.1.4
  firebase_auth: ^5.3.4
  firebase_storage: ^12.3.7
  flip_card: ^0.7.0
  fluentui_system_icons: ^1.1.265
  flutter:
    sdk: flutter
  flutter_flip_card: ^0.0.6
  flutter_localizations:
    sdk: flutter
  go_router: ^14.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  html: ^0.15.5
  http: ^1.4.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  just_audio: ^0.9.42
  logging: ^1.3.0
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  dart_web_scraper: ^0.1.3
  pod_player: ^0.2.2
  provider: ^6.1.2
  pub_semver: ^2.1.5
  rxdart: ^0.28.0
  shared_preferences: ^2.3.2
  together_ai_sdk: ^2.0.2
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  youtube_explode_dart: ^2.5.2
  youtube_player_flutter: ^9.1.1
  genius_lyrics: ^1.0.1
  widget_visibility_checker: ^1.0.2
  path: ^1.9.0
  flutter_lyric: ^2.0.4+6
  lyrics_parser: ^1.0.0-nullsafety.0
  onnxruntime: ^1.4.1
  flutter_sound: ^9.2.13
  permission_handler: ^11.0.1
  mic_stream: ^0.7.2
  tflite_flutter: ^0.11.0
  headset_connection_event: ^4.0.2
  flutter_nfc_kit: ^3.6.0
  ndef: ^0.3.4
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/licenses/
    - assets/giphy.gif
    - assets/models/1.tflite
    - assets/models/yamnet_class_map.csv
    - assets/icon.png
      # <-- add your splash video here
          # <-- optional: keep if you place splash.mp4

  fonts:
    - family: paytoneOne
      fonts:
        - asset: fonts/paytone/PaytoneOne-Regular.ttf

flutter_native_splash:
  color: '#ffffff'
  # flutter_native_splash expects an image (png/jpg). DO NOT point it at an mp4.
  # Replace with a static png (create assets/images/dew_drop.png) or remove the image entries.
  image: assets/icon.png
  color_dark: '#151515'
  image_dark: assets/icon.png

  android_12:
    image: assets/icon.png
    icon_background_color: '#ffffff'
    image_dark: assets/icon.png
    icon_background_color_dark: '#151515'

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  adaptive_icon:
    foreground_image: "assets/mountain.png"
    background_color: "#FFFFFF"
