name: dew
description: Music Streaming app made in Flutter!


publish_to: 'none'
version: '9.0.1' # run update.sh after changing the version

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ^3.27.0

dependencies:
  
  animated_bottom_navigation_bar: ^1.3.3
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  cached_network_image: ^3.4.1
  # Firebase removed
  # firebase_auth: ^6.1.3
  # firebase_storage: ^13.0.5
  # firebase_core: ^4.3.0
  # firebase_database: ^12.1.1
  # cloud_firestore: ^6.1.1
  
  appwrite: ^17.1.0
  uuid: ^4.2.2

  flip_card: ^0.7.0
  fluentui_system_icons: ^1.1.265
  flutter:
    sdk: flutter
  flutter_flip_card: ^0.0.6
  flutter_localizations:
    sdk: flutter
  go_router: ^14.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  html: ^0.15.5
  http: ^1.4.0
  image_picker: ^1.1.2
  intl: 0.20.2
  just_audio: ^0.9.42
  logging: ^1.3.0
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  dart_web_scraper: ^0.1.3

  provider: ^6.1.2
  lyrics_parser: ^1.0.0-nullsafety.0
  onnxruntime: ^1.4.1
  flutter_sound: ^9.2.13
  permission_handler: ^11.0.1
  mic_stream: ^0.7.2
  tflite_flutter: ^0.11.0
  headset_connection_event: ^4.0.2
  flutter_nfc_kit: ^3.6.0
  ndef: ^0.3.4
  flutter_native_splash: ^2.4.4
  google_fonts: ^6.3.0
  flutter_animate: ^4.5.2
  file_picker: ^8.0.0
  dart_des: ^1.0.0
  
  youtube_explode_dart: ^3.0.0
  shared_preferences: ^2.5.3
  flutter_lyric: ^2.0.4
  youtube_player_flutter: ^9.1.3
  together_ai_sdk: ^2.0.2
  pub_semver: ^2.2.0
  flutter_lyric_custom_ui: ^2.0.4+8
  genius_lyrics: ^1.0.1
  rxdart: ^0.28.0
  flutter_gen: ^5.12.0
  video_player: ^2.10.0
  share_plus: ^10.1.4

  # Desktop packages
  window_manager: ^0.4.0
  system_tray: ^2.0.0
  hotkey_manager: ^0.2.0
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  
  flutter_riverpod: ^2.6.1
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4



flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/licenses/
    - assets/giphy.gif
    - assets/models/1.tflite
    - assets/models/yamnet_class_map.csv
    # - assets/models/qwen2.5-coder-7b-instruct-q3_k_m.gguf  # Commented out due to large size (3.8GB)
    - assets/icon.png
      # <-- add your splash video here
          # <-- optional: keep if you place splash.mp4

  fonts:
    - family: paytoneOne
      fonts:
        - asset: fonts/paytone/PaytoneOne-Regular.ttf

flutter_native_splash:
  color: '#ffffff'
  # flutter_native_splash expects an image (png/jpg). DO NOT point it at an mp4.
  # Replace with a static png (create assets/images/dew_drop.png) or remove the image entries.
  image: assets/icon.png
  color_dark: '#151515'
  image_dark: assets/icon.png

  android_12:
    image: assets/icon.png
    icon_background_color: '#ffffff'
    image_dark: assets/icon.png
    icon_background_color_dark: '#151515'

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  adaptive_icon:
    foreground_image: "assets/mountain.png"
    background_color: "#FFFFFF"

dependency_overrides:
  mic_stream:
    path: packages/mic_stream
  uuid: ^4.1.0
